name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Manifest version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r .version custom_components/catanio/manifest.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match manifest version $version"
            exit 1
          fi
