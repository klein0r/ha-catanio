rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: |
      aiocoap and protobuf are public on PyPI. The CatanIO client in api/ has
      no Home Assistant imports and still has to be published as a library.
  docs-actions:
    status: exempt
    comment: The integration does not register service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only use the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The CoAP API of the devices does not use authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery:
    status: done
    comment: |
      Integration discovery. DHCP discovery ignores the link-local addresses
      of the devices and they do not announce themselves via zeroconf.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      Each config entry is a single device. New extension modules are offered
      by the discovery.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: There are no issues the user has to repair.
  stale-devices:
    status: done
    comment: |
      Each config entry is a single device. Entities of disabled channels or
      channels that changed their mode are removed.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      The integration does not use HTTP. All config entries share one CoAP
      context.
  strict-typing: done
